# Construye la imagen y la publica en GHCR en cada push a main. El build de la
# imagen corre build.mjs y el verificador: si fallan, no se publica nada.
#
# El deploy no pasa por acá: la VPS no tiene puertos abiertos (todo entra por
# el Cloudflare Tunnel, SSH incluido), así que en vez de darle acceso a un
# runner, la VPS tira: su timer de deploy baja la imagen nueva. Qué corre ahí,
# y cómo, se decide en el repo infra. Mismo esquema que museo.

name: build & publish

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  image:
    # Runner arm porque la VPS es arm: la imagen sale nativa, sin QEMU.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # El tag por SHA es el rollback.
          tags: |
            ghcr.io/nks21may/portafolio:latest
            ghcr.io/nks21may/portafolio:${{ github.sha }}
          # Ata el package al repo para que herede sus permisos (privado) en vez
          # de quedar como package suelto de la cuenta.
          labels: org.opencontainers.image.source=https://github.com/nks21may/portafolio
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Cada push agrega una versión. Cinco alcanzan para volver atrás; si la
      # poda falla, la imagen ya está publicada.
      - uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: portafolio
          package-type: container
          min-versions-to-keep: 5
