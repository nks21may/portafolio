# nginx — Nicolás D'Alessandro (variante "d-ficha")
#
# GENERADO POR build.mjs. No lo edites a mano: la CSP lleva los hashes del CSS
# y del JS de esta variante y se regeneran en cada build.
#
#   sudo cp deploy/d-ficha-nginx.conf /etc/nginx/sites-available/nicolasdalessandro.dev
#   sudo ln -s /etc/nginx/sites-available/nicolasdalessandro.dev /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# La raíz es el contenido de dist/d-ficha/:
#   rsync -av --delete dist/d-ficha/ servidor:/var/www/nicolasdalessandro.dev/
#
# Certificado con certbot:
#   sudo certbot --nginx -d nicolasdalessandro.dev -d www.nicolasdalessandro.dev

server {
    listen 80;
    listen [::]:80;
    server_name nicolasdalessandro.dev www.nicolasdalessandro.dev;
    return 301 https://nicolasdalessandro.dev$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.nicolasdalessandro.dev;

    ssl_certificate     /etc/letsencrypt/live/nicolasdalessandro.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nicolasdalessandro.dev/privkey.pem;

    return 301 https://nicolasdalessandro.dev$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nicolasdalessandro.dev;

    root /var/www/nicolasdalessandro.dev;
    index index.html;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/nicolasdalessandro.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nicolasdalessandro.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Cabeceras ───────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; connect-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'sha256-rTKrAXq5qyYXGS3YOHFZ7jCn8/Pv3mAy72F61Md/u+w='; script-src 'sha256-P34l84ieRzQq7CFlZlM9j0GQWtsZdJLVmvsH4P0Mo9U=' 'sha256-Rw/cGTZI742ZI4QgZsWnMXKQukbdWpCrqKoTaObz99Y=' 'sha256-dE+2xgkBNAH1xY7mM7aCn/6oL8OKyOyNtXm2Hi1PBXM='; manifest-src 'self'; frame-ancestors 'none'" always;

    # ── Compresión ──────────────────────────────────────────────────────
    # woff2, png y jpg ya vienen comprimidos: no los pases por gzip.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml application/xml;

    # Si tu build de nginx trae brotli, descomentá — el HTML es casi todo
    # texto inline y comprime muy bien:
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/manifest+json
    #              image/svg+xml application/xml;

    # ── Caché ───────────────────────────────────────────────────────────
    # El HTML nunca se cachea: es lo que trae los cambios de contenido, y
    # además lleva el CSS y el JS adentro.
    location = /             { add_header Cache-Control "no-cache" always; }
    location = /index.html   { add_header Cache-Control "no-cache" always; }
    location = /en/          { add_header Cache-Control "no-cache" always; }
    location = /en/index.html { add_header Cache-Control "no-cache" always; }

    # Las fuentes tienen el peso y el subconjunto en el nombre: si cambia el
    # contenido, cambia el nombre. Se pueden cachear para siempre.
    location ^~ /assets/fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(png|jpe?g|webp|svg|ico|pdf)$ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # ── Rutas ───────────────────────────────────────────────────────────
    location = /en { return 301 /en/; }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. { return 404; }

    error_page 404 /index.html;
}
